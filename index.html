<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Chat - Brutalist</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-main: #F4F4F0;
            --bg-white: #FFFFFF;
            --accent-yellow: #FFD600;
            --accent-cyan: #8AD4E8;
            --accent-red: #FF6B6B;
            --black: #000000;
            --gray: #E0E0E0;
            
            --border: 3px solid var(--black);
            --shadow: 4px 4px 0px var(--black);
            --shadow-sm: 2px 2px 0px var(--black);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* SVG Icons */
        .icon { width: 20px; height: 20px; stroke: var(--black); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .icon-sm { width: 16px; height: 16px; }
        .icon-lg { width: 28px; height: 28px; }

        /* === SCREEN: AUTHENTICATION === */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-main); z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-box {
            background: var(--bg-white); border: var(--border); border-radius: var(--radius);
            box-shadow: 8px 8px 0px var(--black); padding: 40px; width: 400px; max-width: 90%;
        }
        .auth-box h2 { text-align: center; margin-bottom: 20px; font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-control {
            width: 100%; padding: 12px; border: var(--border); border-radius: 8px;
            font-size: 16px; font-weight: 600; outline: none; box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
        }
        .btn-primary {
            width: 100%; padding: 14px; background: var(--accent-yellow); border: var(--border);
            border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: var(--shadow); transition: transform 0.1s;
        }
        .btn-primary:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--black); }
        .auth-toggle { text-align: center; margin-top: 15px; font-size: 14px; cursor: pointer; font-weight: 600; text-decoration: underline; }

        /* === MAIN LAYOUT === */
        #app-screen { display: none; width: 100vw; height: 100vh; }
        
        /* Sidebar (Desktop) / Bottom Nav (Mobile) */
        .sidebar {
            width: 80px; border-right: var(--border); background: var(--bg-white);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px;
        }
        .nav-btn {
            width: 50px; height: 50px; border: var(--border); border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            background: var(--bg-white); transition: 0.1s;
        }
        .nav-btn.active { background: var(--accent-yellow); box-shadow: var(--shadow-sm); }
        .nav-btn:hover:not(.active) { background: var(--gray); }
        
        /* Main Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        
        /* Header */
        .top-header {
            height: 80px; border-bottom: var(--border); background: var(--bg-white);
            display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
        }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%; border: var(--border);
            background: var(--gray); overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .header-actions { display: flex; gap: 15px; }
        .search-btn {
            display: flex; align-items: center; gap: 10px; padding: 10px 20px;
            background: var(--bg-white); border: var(--border); border-radius: 30px;
            box-shadow: var(--shadow-sm); cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .search-btn:active { transform: translate(2px, 2px); box-shadow: none; }

        /* Views (Chat List, Group, Profile) */
        .view { display: none; flex: 1; overflow-y: auto; padding: 30px; }
        .view.active { display: flex; flex-direction: column; }
        
        /* Chat List Item */
        .list-item {
            display: flex; align-items: center; padding: 15px; background: var(--bg-white);
            border: var(--border); border-radius: var(--radius); margin-bottom: 15px;
            box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.1s;
        }
        .list-item:active { transform: translate(2px, 2px); box-shadow: none; }
        .list-item .avatar { margin-right: 15px; }
        .list-info h4 { font-size: 16px; margin-bottom: 4px; }
        .list-info p { font-size: 13px; color: #555; }

        /* Chat Room Area */
        #chat-room {
            display: none; flex: 1; flex-direction: column; height: calc(100vh - 80px);
            background: var(--bg-white); position: absolute; top: 80px; left: 0; right: 0; z-index: 10;
        }
        #chat-room.active { display: flex; }
        
        .chat-room-header {
            padding: 15px 30px; border-bottom: var(--border); background: var(--accent-cyan);
            display: flex; align-items: center; gap: 15px;
        }
        .back-btn { background: var(--bg-white); border: var(--border); border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: var(--shadow-sm); }
        
        .messages-container { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg {
            max-width: 60%; padding: 12px 18px; border: var(--border);
            border-radius: var(--radius); font-size: 15px; font-weight: 500; line-height: 1.4;
        }
        .msg.received { align-self: flex-start; background: var(--gray); border-bottom-left-radius: 0; box-shadow: var(--shadow-sm); }
        .msg.sent { align-self: flex-end; background: var(--accent-yellow); border-bottom-right-radius: 0; box-shadow: var(--shadow-sm); }
        .msg-sender { font-size: 11px; font-weight: bold; color: #333; margin-bottom: 5px; display: block; }
        
        .chat-input-area { padding: 20px 30px; border-top: var(--border); display: flex; gap: 15px; }
        .chat-input { flex: 1; padding: 15px; border: var(--border); border-radius: 30px; font-size: 15px; font-weight: 600; outline: none; }
        .send-btn { background: var(--accent-red); border: var(--border); border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: var(--shadow-sm); }

        /* Search Modal */
        #search-modal {
            display: none; position: absolute; top: 90px; right: 30px; width: 350px;
            background: var(--bg-white); border: var(--border); border-radius: var(--radius);
            box-shadow: 6px 6px 0px var(--black); z-index: 50; padding: 20px;
        }
        #search-modal.active { display: block; }
        .search-input-wrapper { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-results { max-height: 300px; overflow-y: auto; }
        
        /* Profile View */
        .profile-card {
            background: var(--bg-white); border: var(--border); border-radius: var(--radius);
            padding: 30px; text-align: center; box-shadow: var(--shadow); max-width: 400px; margin: 0 auto;
        }
        .profile-card .avatar { width: 100px; height: 100px; margin: 0 auto 20px auto; }
        .btn-logout { background: var(--accent-red); color: white; border: var(--border); padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; box-shadow: var(--shadow-sm); }

        /* Responsive (Mobile) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; justify-content: space-around; border-right: none; border-top: var(--border); order: 2; padding: 0; }
            .main-content { order: 1; height: calc(100vh - 70px); }
            #chat-room { height: calc(100vh - 150px); } /* Adjust for bottom nav */
            .top-header { padding: 0 15px; }
            .view { padding: 15px; }
            .search-btn span { display: none; }
            #search-modal { width: 90%; right: 5%; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>

    <!-- ================= SCREEN: AUTH ================= -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter">
            </div>
            <div class="form-group">
                <label>4-Digit PIN</label>
                <input type="password" id="pin" class="form-control" placeholder="Contoh: 1234" maxlength="4">
            </div>
            <button class="btn-primary" onclick="handleAuth()" id="auth-btn">Masuk</button>
            <div class="auth-toggle" onclick="toggleAuthMode()" id="auth-toggle-text">Belum punya akun? Register</div>
        </div>
    </div>

    <!-- ================= SCREEN: MAIN APP ================= -->
    <div id="app-screen">
        
        <!-- SIDEBAR / BOTTOM NAV -->
        <div class="sidebar">
            <div class="nav-btn active" onclick="switchTab('chats', this)" title="Chats">
                <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <div class="nav-btn" onclick="switchTab('groups', this)" title="Groups">
                <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </div>
            <div class="nav-btn" onclick="switchTab('profile', this)" title="Profile">
                <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            
            <!-- HEADER -->
            <div class="top-header">
                <div class="user-profile">
                    <div class="avatar">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" id="my-avatar">
                    </div>
                    <div>
                        <h3 id="my-username">Loading...</h3>
                        <p style="font-size: 12px; color: #555;">Online</p>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="search-btn" onclick="toggleSearchModal()">
                        <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span>Cari User</span>
                    </div>
                </div>
            </div>

            <!-- VIEW: CHATS -->
            <div id="view-chats" class="view active">
                <h2 style="margin-bottom: 20px;">Pesan Langsung</h2>
                <!-- Public Chat Item -->
                <div class="list-item" onclick="openChat('Public Chat', 'public')">
                    <div class="avatar" style="background: var(--accent-cyan); display:flex; justify-content:center; align-items:center;">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div class="list-info">
                        <h4>Public Room</h4>
                        <p>Obrolan global untuk semua pengguna</p>
                    </div>
                </div>
                <!-- Private Chats will be injected here via JS -->
                <div id="private-chats-list"></div>
            </div>

            <!-- VIEW: GROUPS (Formerly Challenges) -->
            <div id="view-groups" class="view">
                <h2 style="margin-bottom: 20px;">Grup Diskusi</h2>
                <div class="list-item" onclick="alert('Fitur grup akan datang!')">
                    <div class="avatar" style="background: var(--accent-yellow); display:flex; justify-content:center; align-items:center;">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <div class="list-info">
                        <h4>Design Team</h4>
                        <p>5 Anggota</p>
                    </div>
                </div>
            </div>

            <!-- VIEW: PROFILE (Formerly Stats) -->
            <div id="view-profile" class="view">
                <h2 style="margin-bottom: 20px;">Profil Saya</h2>
                <div class="profile-card">
                    <div class="avatar">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" id="profile-avatar">
                    </div>
                    <h3 id="profile-username" style="font-size: 24px; margin-bottom: 5px;">Username</h3>
                    <p style="color: #666; margin-bottom: 20px;">Bergabung hari ini</p>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- CHAT ROOM OVERLAY -->
            <div id="chat-room">
                <div class="chat-room-header">
                    <button class="back-btn" onclick="closeChat()">
                        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <div class="avatar" style="width: 40px; height: 40px; margin-right: 10px;">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=public" id="chat-avatar">
                    </div>
                    <h3 id="chat-title">Public Chat</h3>
                </div>
                <div class="messages-container" id="messages-container">
                    <!-- Messages injected here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="message-input" class="chat-input" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">
                        <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>

            <!-- SEARCH MODAL -->
            <div id="search-modal">
                <div class="search-input-wrapper">
                    <input type="text" id="search-user-input" class="chat-input" style="padding: 10px;" placeholder="Cari username..." oninput="searchUsers()">
                </div>
                <div class="search-results" id="search-results">
                    <!-- Hasil pencarian -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // === STATE ===
        let isRegisterMode = false;
        let currentUser = null;
        let socket = null;
        let currentRoom = null;

        // === AUTHENTICATION ===
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? 'Daftar Akun' : 'Login';
            document.getElementById('auth-btn').innerText = isRegisterMode ? 'Daftar' : 'Masuk';
            document.getElementById('auth-toggle-text').innerText = isRegisterMode ? 'Sudah punya akun? Login' : 'Belum punya akun? Register';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const pin = document.getElementById('pin').value;

            if (!username || !password || pin.length !== 4) {
                return alert('Isi semua kolom dengan benar (PIN harus 4 digit)');
            }

            const endpoint = isRegisterMode ? '/api/register' : '/api/login';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, pin })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('chat_user', JSON.stringify(currentUser));
                    initApp();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert('Terjadi kesalahan pada server');
            }
        }

        // === INITIALIZATION ===
        function initApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            
            // Set UI Text
            document.getElementById('my-username').innerText = currentUser.username;
            document.getElementById('my-avatar').src = currentUser.avatar;
            document.getElementById('profile-username').innerText = currentUser.username;
            document.getElementById('profile-avatar').src = currentUser.avatar;

            // Init Socket
            if (!socket) {
                socket = io();
                socket.on('chat message', receiveMessage);
            }
        }

        function logout() {
            localStorage.removeItem('chat_user');
            window.location.reload();
        }

        // === NAVIGATION ===
        function switchTab(tabName, el) {
            // Update sidebar active state
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            // Update view
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            // Close chat room if open
            closeChat();
        }

        // === SEARCH USER ===
        function toggleSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.toggle('active');
            if(modal.classList.contains('active')) {
                document.getElementById('search-user-input').focus();
            }
        }

        async function searchUsers() {
            const query = document.getElementById('search-user-input').value.trim();
            const resultsDiv = document.getElementById('search-results');
            
            if (query.length < 1) {
                resultsDiv.innerHTML = '';
                return;
            }

            const res = await fetch(`/api/users?search=${query}`);
            const users = await res.json();
            
            resultsDiv.innerHTML = '';
            users.forEach(user => {
                if (user.username === currentUser.username) return; // Jangan tampilkan diri sendiri

                const div = document.createElement('div');
                div.className = 'list-item';
                div.style.padding = '10px';
                div.onclick = () => {
                    toggleSearchModal();
                    openChat(user.username, generateRoomId(currentUser.username, user.username), user.avatar);
                };
                div.innerHTML = `
                    <div class="avatar" style="width: 35px; height: 35px; margin-right: 10px;">
                        <img src="${user.avatar}">
                    </div>
                    <div class="list-info"><h4>${user.username}</h4></div>
                `;
                resultsDiv.appendChild(div);
            });
        }

        // === CHAT LOGIC ===
        function generateRoomId(user1, user2) {
            // Buat ID room unik berdasarkan urutan alfabet agar konsisten
            return [user1, user2].sort().join('_');
        }

        function openChat(title, roomId, avatarUrl = null) {
            currentRoom = roomId;
            document.getElementById('chat-title').innerText = title;
            document.getElementById('chat-avatar').src = avatarUrl || `https://api.dicebear.com/7.x/avataaars/svg?seed=${roomId}`;
            
            document.getElementById('messages-container').innerHTML = ''; // Clear old messages
            document.getElementById('chat-room').classList.add('active');
            
            // Join Socket Room
            socket.emit('joinRoom', roomId);
        }

        function closeChat() {
            document.getElementById('chat-room').classList.remove('active');
            currentRoom = null;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (text && currentRoom) {
                socket.emit('chat message', {
                    room: currentRoom,
                    text: text,
                    sender: currentUser.username,
                    avatar: currentUser.avatar
                });
                input.value = '';
            }
        }

        function receiveMessage(data) {
            // Hanya tampilkan jika pesan untuk room yang sedang dibuka
            if (data.room !== currentRoom) return;

            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            
            if (data.sender === currentUser.username) {
                msgDiv.className = 'msg sent';
                msgDiv.innerText = data.text;
            } else {
                msgDiv.className = 'msg received';
                msgDiv.innerHTML = `<span class="msg-sender">${data.sender}</span>${data.text}`;
            }
            
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // === AUTO LOGIN ===
        window.onload = () => {
            const savedUser = localStorage.getItem('chat_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                initApp();
            }
        };
    </script>
</body>
</html>
